<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempos Campo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tempos e Movimentos em Campo</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#14201b;--muted:#5b6b64;--line:#d6dfdb;--pri:#0f6b4a;--dark:#0f3d2e;--danger:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));font-size:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center;gap:8px}
header.top b{font-size:17px}
header.top .clk{font-variant-numeric:tabular-nums;font-size:15px;opacity:.9}
main{padding:12px calc(12px + env(safe-area-inset-right)) 12px calc(12px + env(safe-area-inset-left));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:10px 4px 12px;border:0;background:none;font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 6px}
h3{font-size:15px;margin:14px 0 6px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font-size:16px;padding:11px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:90px;resize:vertical}
input[type=color]{padding:2px;height:42px;width:48px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:var(--ink);font-family:inherit;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.danger{color:var(--danger);border-color:#e8b5b1}
.btn.dangerfill{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:38px;padding:0 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.mt{margin-top:12px}
.muted{color:var(--muted);font-size:13px}
.warn{background:#fff4e5;border:1px solid #f0c27a;color:#6b4300;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.now{border-radius:14px;padding:14px;color:#fff;margin-bottom:10px;background:#555}
.now .lbl{font-size:13px;opacity:.85;font-weight:600}
.now .name{font-size:22px;font-weight:800;margin:2px 0}
.timer{font-variant-numeric:tabular-nums;font-size:42px;font-weight:800;line-height:1.1}
.meta{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.meta b{font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{min-height:70px;border-radius:13px;border:3px solid transparent;font-size:16px;font-weight:800;padding:8px;text-align:center;font-family:inherit;cursor:pointer;line-height:1.2}
.act small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
.stopbtn{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px 8px 8px;background:#fff;border:1px solid var(--line);border-radius:14px;font-family:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .08s}
.stopbtn:active{transform:scale(.98)}
.sb-ic{width:44px;height:44px;border-radius:11px;background:#eef1f0;color:#33413b;display:grid;place-items:center;flex:none}
.sb-ic svg{width:24px;height:24px}
.sb-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sb-tx b{font-size:17px;font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-gs{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.sb-gs i{width:9px;height:9px;border-radius:50%;flex:none}
.sb-gs span{font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sb-n{display:grid;place-items:center;width:32px;height:32px;color:#5b6b64;background:#eef1f0;border-radius:50%;flex:none}
.stopbtn.on{border:2px solid #33413b;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stopbtn.on .sb-ic{background:#33413b;color:#fff}
.stopbtn.on small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:5px}
.stopbtn.on small i{width:8px;height:8px;border-radius:50%;background:#33413b;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.sb-go{display:flex;align-items:center;gap:1px;font-size:13px;font-weight:800;color:var(--muted);flex:none}
.grp{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:12px 2px 6px}
.stopit{display:flex;align-items:center;width:100%;min-height:56px;padding:8px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:700;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.stopit.on{border:3px solid #111}
.stopit .code,.cfgit .code{font-variant-numeric:tabular-nums;background:#eef2f0;border-radius:6px;padding:2px 7px;margin-right:8px;font-size:14px;font-weight:700;color:#14201b}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.dstats div{background:#f6f8f7;border-radius:10px;padding:8px 4px;text-align:center}
.dstats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.dstats span{font-size:11px;color:var(--muted)}
.dzone{margin-top:14px;border:1px solid #f0c9c6;border-radius:12px;overflow:hidden}
.dz-row{display:flex;align-items:center;gap:10px;padding:12px;background:#fffafa}
.dz-row+.dz-row{border-top:1px solid #f0c9c6}
.dz-row>div{flex:1;font-size:14px}
.dz-row .btn{flex:none}
.wbox{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.4}
.wbox.bad{background:#fdecea;color:#7a1d17}
.wbox.ok{background:#e9f5ef;color:#14532d}
.pgt h1{font-size:22px;margin:4px 4px 10px}
.seg{display:flex;background:#e4eae7;border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 6px;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg .cnt{background:#eef1f0;border-radius:8px;padding:0 6px;font-size:12px;margin-left:3px}
.cgh .eqic svg{width:30px;height:20px}
.phs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.phs::-webkit-scrollbar{display:none}
.ph{flex:none;width:76px;height:76px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);background:#eef1f0;padding:0;cursor:pointer;font-family:inherit}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:8px 4px 3px;text-align:center}
.ph.miss::after{content:'indisponível';position:absolute;inset:0;display:grid;place-items:center;font-size:10px;color:var(--muted)}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--pri);border:2px dashed #b9cfc4;background:#f6faf8}
.ph.add span{position:static;background:none;color:var(--pri);padding:0;font-size:12px}
.phprev{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#111;margin:8px 0}
input.up::placeholder,textarea.up::placeholder{text-transform:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.kpis div{background:#f6f8f7;border-radius:10px;padding:8px;text-align:center}
.kpis span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpis b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpis small{font-size:12px;color:var(--muted)}
.cfgit{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0}
.cfgmain{flex:1;display:flex;align-items:center;min-height:48px;background:none;border:0;text-align:left;font-size:15px;font-weight:600;font-family:inherit;color:var(--ink);padding:0 2px;min-width:0;cursor:pointer}
.cfgmain .nm,.stopit .nm{overflow:hidden;text-overflow:ellipsis}
.act.big{min-height:64px;font-size:17px}
/* ---- cabeçalho / tela inicial ---- */
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand small{display:block;font-size:11px;opacity:.7;letter-spacing:.02em}
.logo{width:32px;height:32px;border-radius:9px;background:#1f8a5f;display:grid;place-items:center;color:#fff}
header.top .clk{background:rgba(255,255,255,.1);padding:4px 10px;border-radius:14px;font-size:14px}
.hero{background:linear-gradient(135deg,#0f3d2e 0%,#17694a 100%);color:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 6px 18px rgba(15,61,46,.25)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hello{font-size:21px;font-weight:800}
.date{font-size:13px;opacity:.8;margin-top:2px}
.sync{font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:5px 9px;border-radius:12px;white-space:nowrap}
.sync.ok{background:#7fd6a8;color:#0f3d2e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 8px}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;opacity:.85}
.sec-t{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 4px 8px}
.lnk{background:none;border:0;color:var(--pri);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0;font-family:inherit;cursor:pointer}
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ptile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5b6b64;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.ptile svg{width:52px;height:34px}
.ptile.on{border-color:var(--pri);background:#e9f5ef;color:var(--pri);box-shadow:0 0 0 3px rgba(15,107,74,.12)}
.ptile span{line-height:1.15;text-align:center}
.card.form{padding:4px 14px 14px}
.fhead{font-size:12px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rchips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.rchips::-webkit-scrollbar{display:none}
.rchip{flex:none;border:1px solid var(--line);background:#f6f8f7;border-radius:10px;padding:6px 10px;font-family:inherit;font-size:14px;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;cursor:pointer}
.rchip span{font-size:11px;color:var(--muted)}
.ok8{color:#1b5e20;font-weight:700}
.bad8{color:var(--danger);font-weight:700}
input.inv{border-color:var(--danger)}
.rchip.short{opacity:.55}
.rchip.on{border-color:var(--pri);background:#e9f5ef}
.rchip[hidden]{display:none}
.sesic{width:40px;height:28px;color:var(--pri);margin-right:10px;flex:none;display:grid;place-items:center}
.sesic svg{width:36px;height:24px}
.pill{font-size:12px;font-weight:800;padding:4px 8px;border-radius:10px}
.cta{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));padding:10px 0 4px;background:linear-gradient(to bottom,rgba(242,245,244,0),var(--bg) 35%);margin-top:4px;z-index:3}
.btn.big{min-height:56px;font-size:17px;border-radius:14px;box-shadow:0 6px 16px rgba(15,107,74,.3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,107,74,.15)}
/* ---- tela de acompanhamento sem rolagem ---- */
body.fitmode{padding-bottom:0;overflow:hidden}
body.fitmode main{padding-top:8px;padding-bottom:8px;overflow:hidden}
.obs{display:flex;flex-direction:column;height:100%;gap:8px}
.obs .now{margin:0;padding:10px 12px;flex:none;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.nowtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #eef1f0}
.nowtop b{color:var(--ink)}
.eqic{display:inline-grid;vertical-align:middle;margin-right:6px;color:#5b6b64}
.eqic svg{width:30px;height:20px}
.nowtop .eq{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowtop b{font-variant-numeric:tabular-nums}
.nowtop>span:last-child{white-space:nowrap;flex:none}
.actions .btn{white-space:nowrap}
.nowmain{display:flex;align-items:center;gap:10px}
.gic{width:46px;height:46px;border-radius:12px;background:#eef1f0;color:#33413b;display:grid;place-items:center;flex:none}
.gic svg{width:26px;height:26px}
.nowtx{flex:1;min-width:0}
.tbox{flex:none;text-align:right}
.tbox.idle .timer{color:#c4ccc8}
.since{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.obs .now .lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;position:relative;top:-2px}
.nowfoot{display:flex;align-items:center;gap:8px;margin-top:8px;min-width:0}
.obs .now .name{font-size:20px;line-height:1.15;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.obs .timer{font-size:34px;flex:none;color:var(--ink);letter-spacing:-.5px}
.gpsrow{margin-top:5px}
.ses.pend{color:#8a5300;font-weight:800}
.gpschip{display:inline-block;font-size:11.5px;font-weight:700;background:#eef1f0;color:#33413b;padding:3px 8px;border-radius:10px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.gpschip.bad{background:#fff4e5;color:#8a5300}
.prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prev b{color:#33413b;font-variant-numeric:tabular-nums}
.prev .pl{font-weight:700;margin-right:5px}
.prev .sep{margin:0 5px;opacity:.5}
.note1{margin-top:6px}
.obsmid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.obsmid .grp:first-child{margin-top:0}
.obsmid .grp{margin:8px 2px 4px}
.acts.fill{grid-auto-rows:minmax(64px,auto)}
.obsbot{flex:none;display:flex;flex-direction:column;gap:8px}
.obsbot .stopbtn{margin:0}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.actions .btn{min-height:46px;padding:0 6px;font-size:14px}
.badge{background:#14201b;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;margin-left:2px}
@media (max-height:700px){ .gic{width:38px;height:38px} .nowtop{margin-bottom:5px;padding-bottom:5px} .note1{display:none} .obs .timer{font-size:30px} .prev{display:none} .act.big,.acts.fill{min-height:50px;font-size:15px} .acts.fill{grid-auto-rows:minmax(50px,auto)} .act{padding:5px} .obsbot .stopbtn{min-height:54px;padding-top:5px;padding-bottom:5px} .sb-ic{width:38px;height:38px} .obsmid .grp{margin:4px 2px 3px} }
@media (max-width:380px){ .actions .btn{font-size:13px} }
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.sgrp{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-left:4px solid;padding:2px 8px;margin:12px 0 6px}
.stopit .g{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;padding-left:8px;display:none}
#stList.searching .g{display:inline}
.cgh{border-left:4px solid;padding:4px 10px;margin:16px 0 4px;background:#f6f8f7;border-radius:0 8px 8px 0}
.star{font-size:20px;color:#b0b8b4;width:24px;text-align:center;flex:none;pointer-events:none}
.star.on{color:#f2a900}
.act.cur{border-color:#111;box-shadow:inset 0 0 0 3px #fff}
.act:active{transform:scale(.97)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it.tap{cursor:pointer}
.it .l{display:flex;align-items:center;min-width:0}
.it .l div{min-width:0}
.it .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.it .r{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:10px;flex:none}
.bar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:#e7ecea;margin:8px 0}
.bar div{height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.note{background:#f6f8f7;border-left:4px solid #9aa9a2;padding:8px 10px;border-radius:6px;margin:6px 0;font-size:14px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top));background:#14201b;color:#fff;padding:10px 18px;border-radius:22px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.actrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.actrow input[type=text]{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:#f6f8f7;border-radius:18px;padding:7px 12px;font-size:14px;font-family:inherit;cursor:pointer}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:24px;height:24px;flex:none}
</style>
</head>
<body>

<script>
"use strict";
const KEY = 'tempos_campo_v1';
// Perfis do CCT (corte, carregamento e transporte) de cana
// grupos: P Produtivo (botões na tela) | A Auxiliar | C Clima | M Manutenção | X Perdida (dentro do botão Paradas)
// 4º campo = principal (★): aparece como botão grande no topo da tela de acompanhamento
// código: preencha em Configurar com o código usado na telemetria
const GROUPS = {
  P:{name:'Produtivo',  color:'#2e7d32'},
  A:{name:'Auxiliar',   color:'#1565c0'},
  C:{name:'Clima',      color:'#0097a7'},
  M:{name:'Manutenção', color:'#6d4c41'},
  X:{name:'Perdida',    color:'#c62828'}
};
const GORDER = ['P','A','C','M','X'];
const PROFILE_DEFS = {
  colhedora: { label:'Colhedora', link:'Transbordo(s) atendendo', acts:[
    ['Colhendo','#2e7d32','P',1],
    ['Manobra de cabeceira','#f9a825','A',1],
    ['Deslocamento sem colher','#5c6bc0','A',0],

    ['Abastecimento','#455a64','A',0],
    ['Troca de turno / refeição','#8d8d8d','A',0],
    ['Chuva / clima','#0288d1','C',0],
    ['Troca de facas','#ad1457','M',0],
    ['Manutenção / quebra','#4e342e','M',0],
    ['Aguardando transbordo','#ef6c00','X',1],
    ['Parada operacional','#c62828','X',0]
  ], notes:['Sem transbordo disponível','Embuchamento','Pedra / toco','Cana acamada','Falha no extrator','Falha no picador','Terreno úmido','Fim de talhão','Ordem do líder'] },
  transbordo: { label:'Transbordo', link:'Colhedora atendida', acts:[
    ['Recebendo da colhedora','#2e7d32','P',1],
    ['Deslocando carregado','#6a1b9a','P',1],
    ['Transferindo p/ caminhão','#00897b','P',1],
    ['Deslocando vazio','#5c6bc0','P',1],
    ['Manobra','#f9a825','A',1],
    ['Abastecimento','#455a64','A',0],
    ['Troca de turno / refeição','#8d8d8d','A',0],
    ['Chuva / clima','#0288d1','C',0],
    ['Manutenção / quebra','#4e342e','M',0],
    ['Aguardando caminhão','#ef6c00','X',1],
    ['Aguardando colhedora','#bf360c','X',1],
    ['Parada operacional','#c62828','X',0]
  ], notes:['Colhedora parada','Sem caminhão no ponto','Atolamento','Perda de cana na transferência','Carreador ruim','Falha mecânica','Ordem do líder'] },
  canavieiro: { label:'Caminhão canavieiro', link:'Frente / transbordo', acts:[
    ['Carregando (transbordo)','#1565c0','P',1],
    ['Trajeto carregado','#6a1b9a','P',1],
    ['Descarregando (hilo)','#00897b','P',1],
    ['Trajeto vazio','#5c6bc0','P',1],
    ['Engate / desengate','#f9a825','A',1],
    ['Pesagem / amostragem','#0288d1','A',0],
    ['Abastecimento','#455a64','A',0],
    ['Troca de motorista / refeição','#8d8d8d','A',0],
    ['Chuva / clima','#26a69a','C',0],
    ['Manutenção / quebra','#4e342e','M',0],
    ['Fila na lavoura','#ef6c00','X',1],
    ['Fila na usina','#bf360c','X',1],
    ['Parada operacional','#c62828','X',0]
  ], notes:['Fila grande na usina','Atraso do transbordo','Problema no engate','Desvio de rota','Pneu','Falha mecânica','Atolamento'] }
};
const UP = v => String(v ?? '').toLocaleUpperCase('pt-BR');
function buildProfiles(){
  const o = {};
  for (const k in PROFILE_DEFS) { const p = PROFILE_DEFS[k];
    o[k] = { label:p.label, link:p.link, acts:p.acts.map(a=>({id:uid(), code:'', name:UP(a[0]), color:a[1], cat:a[2], fav:!!a[3]})), notes:p.notes.map(UP) }; }
  return o;
}
// completa dados de versões anteriores (sem grupo / código / principal)
function migrate(d){
  if (d.settings.upperV !== 1) {   // padroniza cadastros em caixa alta
    for (const k in d.settings.profiles) { const P = d.settings.profiles[k]; P.acts.forEach(a => { a.name = UP(a.name); a.code = UP(a.code); }); P.notes = (P.notes||[]).map(UP); }
    (d.equipments||[]).forEach(e => { e.code = UP(e.code); e.type = UP(e.type); });
    d.settings.observer = UP(d.settings.observer); d.settings.lastEquip = UP(d.settings.lastEquip); d.settings.upperV = 1;
  }
  if (d.settings.gpsV !== 2) { d.settings.gps = true; d.settings.gpsInt = d.settings.gpsInt || 5; d.settings.gpsV = 2; }
  (d.sessions||[]).forEach(s => { if (!s.track) s.track = []; });
  for (const k in d.settings.profiles) {
    const def = PROFILE_DEFS[k];
    d.settings.profiles[k].acts.forEach(a => {
      if (a.code == null) a.code = '';
      const m = def && def.acts.find(x => UP(x[0]) === UP(a.name));
      if (!GROUPS[a.cat]) a.cat = m ? m[2] : (a.cat === 'S' ? 'X' : 'P');
      if (a.fav == null) a.fav = m ? !!m[3] : a.cat === 'P';
    });
  }
  return d;
}
function gName(c){ return (GROUPS[c] || GROUPS.X).name; }
function isStop(c){ return c !== 'P'; }

let storageOK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e) { storageOK = false; }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function defaults(){
  return {
    v:1,
    settings:{ profiles: buildProfiles(), offsetSec:0, observer:'', wake:true, gps:true, gpsInt:5, gpsV:2, lastEquip:'', lastProfile:'colhedora' },
    equipments:[], sessions:[], activeId:null
  };
}
function load(){
  if (!storageOK) return defaults();
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const d = JSON.parse(s), def = defaults();
      d.settings = Object.assign(def.settings, d.settings || {});
      d.equipments = d.equipments || []; d.sessions = d.sessions || [];
      return migrate(d);
    }
  } catch(e) {}
  return defaults();
}
let D = load();
function save(){
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch(e){ toast('⚠️ Não foi possível salvar. Exporte os dados!'); }
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const app = $('#app');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function now(){ return Date.now() + (Number(D.settings.offsetSec)||0)*1000; }
function p2(n){ return String(n).padStart(2,'0'); }
function hms(t){ const d=new Date(t); return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }
function dmy(t){ const d=new Date(t); return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear(); }
function ymdhms(t){ const d=new Date(t); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+hms(t); }
function fmtDur(ms){
  ms = Math.max(0, ms); const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return h ? h+':'+p2(m)+':'+p2(ss) : p2(m)+':'+p2(ss);
}
function textColor(hex){
  const h = hex.replace('#',''); const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 160 ? '#111' : '#fff';
}
function prof(k){ return D.settings.profiles[k] || D.settings.profiles.colhedora; }
function actsOf(s){ return prof(s.profile).acts; }
function done(){ return D.sessions.filter(s => s.start != null); }   // observações já iniciadas
function active(){ return D.sessions.find(s => s.id === D.activeId) || null; }
function curEvent(s){ const e = s && s.events[s.events.length-1]; return e && e.end == null ? e : null; }
function evEnd(s, e){ return e.end ?? s.end ?? now(); }
function vib(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hidden'),2600); }

function openModal(html){ $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#sheet').innerHTML=''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function confirmBox(title, msg, okLabel, onOk, danger){
  openModal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p>
    <div class="row mt"><button class="btn" id="mNo">Cancelar</button>
    <button class="btn ${danger?'dangerfill':'pri'}" id="mOk">${esc(okLabel)}</button></div>`);
  $('#mNo').onclick = closeModal;
  $('#mOk').onclick = () => { closeModal(); onOk(); };
}

// ---------- wake lock / gps ----------
let wakeLock = null;
async function updateWake(){
  try {
    if (D.settings.wake && active() && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock=null; }); }
    } else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') { updateWake(); render(); } });

// ---------- GPS: trajeto (caminhamento) ----------
// cada ponto: [tempo_ms, lat, lon, precisão_m, velocidade_kmh]
let watchId = null, lastFix = null, gpsErr = '';
const MAX_ACC = 50;                       // descarta leituras com precisão pior que 50 m
function haversine(a1, o1, a2, o2){
  const R = 6371000, r = Math.PI/180, dA = (a2-a1)*r, dO = (o2-o1)*r;
  const h = Math.sin(dA/2)**2 + Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function onPos(p){
  const c = p.coords; gpsErr = '';
  lastFix = {t: now(), lat:+c.latitude.toFixed(6), lon:+c.longitude.toFixed(6), acc:Math.round(c.accuracy), spd: c.speed!=null && c.speed>=0 ? +(c.speed*3.6).toFixed(1) : null};
  const s = active(); if (!s || s.start == null) { updateGpsChip(); return; }
  if (!s.track) s.track = [];
  if (lastFix.acc > MAX_ACC) { updateGpsChip(); return; }
  const last = s.track[s.track.length-1];
  const iv = (Number(D.settings.gpsInt)||5) * 1000;
  if (last) {
    const dt = lastFix.t - last[0], d = haversine(last[1], last[2], lastFix.lat, lastFix.lon);
    if (dt < iv) { updateGpsChip(); return; }
    if (d < 3 && dt < 30000) { updateGpsChip(); return; }   // parado: grava no máx. 1 ponto a cada 30 s
    s.dist = (s.dist||0) + (d > Math.max(3, lastFix.acc*0.5) ? d : 0);
  }
  s.track.push([lastFix.t, lastFix.lat, lastFix.lon, lastFix.acc, lastFix.spd]);
  save(); updateGpsChip();
}
function onPosErr(e){ gpsErr = e.code === 1 ? 'GPS sem permissão' : 'Procurando sinal GPS…'; updateGpsChip(); }
function updateTracking(){
  const want = !!(D.settings.gps && active() && 'geolocation' in navigator);
  try {
    if (want && watchId == null) watchId = navigator.geolocation.watchPosition(onPos, onPosErr, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
    else if (!want && watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  } catch(e){ gpsErr = 'GPS indisponível'; }
}
function gpsChipText(){
  const s = active();
  if (!D.settings.gps) return '📍 GPS desligado';
  if (!('geolocation' in navigator)) return '📍 GPS indisponível';
  if (gpsErr && (!lastFix || now()-lastFix.t > 20000)) return '📍 ' + gpsErr;
  if (!lastFix) return '📍 Procurando sinal GPS…';
  const km = ((s && s.dist) || 0) / 1000;
  return `📍 ±${lastFix.acc} m · ${km.toFixed(2).replace('.',',')} km · ${(s && s.track ? s.track.length : 0)} pts`;
}
function updateGpsChip(){ const el = document.getElementById('gpsChip'); if (el) { el.textContent = gpsChipText(); el.classList.toggle('bad', !lastFix || lastFix.acc > MAX_ACC || !!gpsErr); } }
function captureGPS(target){
  if (!D.settings.gps || !('geolocation' in navigator)) return;
  if (lastFix && now() - lastFix.t < 15000 && lastFix.acc <= MAX_ACC) { target.lat = lastFix.lat; target.lon = lastFix.lon; return; }
  try {
    navigator.geolocation.getCurrentPosition(p => {
      target.lat = +p.coords.latitude.toFixed(6); target.lon = +p.coords.longitude.toFixed(6); save();
    }, ()=>{}, {enableHighAccuracy:true, timeout:15000, maximumAge:10000});
  } catch(e){}
}
// posição mais próxima de um instante (para marcar eventos/anotações no mapa)
function posAt(s, t, fallback){
  const T = s.track || []; let best = null, bd = Infinity;
  let lo = 0, hi = T.length - 1;
  while (lo <= hi) { const m = (lo+hi)>>1; if (T[m][0] < t) lo = m+1; else hi = m-1; }
  [lo-1, lo].forEach(i => { if (T[i]) { const d = Math.abs(T[i][0]-t); if (d < bd) { bd = d; best = T[i]; } } });
  if (best && bd <= 120000) return [best[1], best[2]];
  if (fallback && fallback.lat != null) return [fallback.lat, fallback.lon];
  return best ? [best[1], best[2]] : null;
}
function segPoints(s, start, end){
  const T = s.track || [];
  const pts = T.filter(p => p[0] >= start && p[0] <= end);
  const before = [...T].reverse().find(p => p[0] < start);   // liga o segmento ao anterior
  if (before && start - before[0] < 120000) pts.unshift(before);
  return pts;
}
function segDist(pts){ let d = 0; for (let i=1;i<pts.length;i++){ const x = haversine(pts[i-1][1],pts[i-1][2],pts[i][1],pts[i][2]); if (x > 3) d += x; } return d; }

// ---------- navigation ----------
let tab = 'obs', detailId = null;
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; detailId = null; render(); window.scrollTo(0,0); });
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const warn = storageOK ? '' : `<div class="warn">⚠️ Este navegador não permite salvar dados neste modo. Exporte o CSV antes de fechar a página.</div>`;
  if (tab === 'obs') app.innerHTML = warn + viewObserve();
  else if (tab === 'ses') app.innerHTML = warn + (detailId ? viewDetail(detailId) : viewSessions());
  else if (tab === 'cad') app.innerHTML = warn + viewCadastros();
  else app.innerHTML = warn + viewConfig();
  const fit = tab === 'obs' && !!active();
  document.body.classList.toggle('fitmode', fit);
  fitSize();
  bind();
  tick();
}
// tela de acompanhamento ocupa exatamente o espaço entre o cabeçalho e o menu (sem rolar a página)
function fitSize(){
  if (!document.body.classList.contains('fitmode')) { app.style.height = ''; return; }
  const h = window.innerHeight - document.querySelector('header.top').offsetHeight - document.querySelector('nav.tabs').offsetHeight;
  app.style.height = Math.max(h, 320) + 'px';
}
window.addEventListener('resize', fitSize);
window.addEventListener('orientationchange', () => setTimeout(fitSize, 300));

// ---------- OBSERVE ----------
function viewObserve(){
  const s = active();
  if (!s) return viewStart();
  const cur = curEvent(s);
  const bg = cur ? cur.color : '#555';
  const btn = (a, big) => {
    const isCur = cur && cur.actId === a.id;
    const sub = [a.cat !== 'P' ? gName(a.cat) : '', a.code].filter(Boolean).join(' · ');
    return `<button class="act ${big?'big':''} ${isCur?'cur':''}" data-act="${a.id}" style="background:${a.color};color:${textColor(a.color)}">${isCur?'● ':''}${esc(a.name)}${sub?`<small>${esc(sub)}</small>`:''}</button>`;
  };
  const all = actsOf(s);
  const favs = all.filter(a => a.fav).map(a => btn(a, true)).join('');
  const prods = all.filter(a => a.cat === 'P' && !a.fav).map(a => btn(a, false)).join('');
  const nStops = all.filter(a => isStop(a.cat)).length;
  const inStop = cur && isStop(evInfo(s,cur).cat);
  const stopIcon = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M8.2 2.5h7.6l5.7 5.7v7.6l-5.7 5.7H8.2l-5.7-5.7V8.2z"/><path d="M8 12h8"/></svg>`;
  const stopGroups = GORDER.filter(isStop).map(g => ({g, n: all.filter(a => a.cat === g).length})).filter(x => x.n);
  const curG = inStop ? evInfo(s,cur).cat : null;
  const stopBtn = inStop
    ? `<button class="stopbtn on" id="bStops">
        <span class="sb-ic">${GICONS[curG]}</span>
        <span class="sb-tx"><small><i></i>Em parada · ${esc(gName(curG))}${cur.actCode?' · '+esc(cur.actCode):''}</small><b>${esc(cur.actName)}</b></span>
        <span class="sb-go">Trocar<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></button>`
    : `<button class="stopbtn" id="bStops">
        <span class="sb-ic">${stopIcon}</span>
        <span class="sb-tx"><b>Registrar parada</b><span class="sb-gs"><span>${nStops} motivos · ${stopGroups.length} grupos</span></span></span>
        <span class="sb-n"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></button>`;
  const prev = s.events.slice(cur ? -3 : -2, cur ? -1 : undefined).reverse()
    .map(e => `<span>${esc(e.actName)} <b>${fmtDur(evEnd(s,e)-e.start)}</b></span>`).join('<span class="sep">›</span>');
  const cg = cur ? evInfo(s,cur).cat : null;
  const lastMark = s.marks[s.marks.length-1];
  return `<div class="obs">
    <div class="now">
      <div class="nowtop"><span class="eq"><span class="eqic">${ICONS[s.profile]||''}</span>${esc(prof(s.profile).label)} <b>${esc(s.equipCode)}</b>${s.operator?' · '+esc(s.operator):''}</span>${s.start!=null?`<span class="ses">Sessão <b data-since="${s.start}">${fmtDur(now()-s.start)}</b></span>`:'<span class="ses pend">● Pronto</span>'}</div>
      <div class="nowmain">
        <span class="gic">${GICONS[cg] || GICONS.idle}</span>
        <div class="nowtx">
          <div class="lbl">${cur?esc(gName(cg))+(cur.actCode?' · cód. '+esc(cur.actCode):''):'Pronto para iniciar'}</div>
          <div class="name"><i class="cdot" style="background:${cur?cur.color:'#c4ccc8'}"></i>${cur?esc(cur.actName):'Toque na operação atual'}</div>
        </div>
        <div class="tbox ${cur?'':'idle'}"><div class="timer" ${cur?`data-since="${cur.start}"`:''}>${cur?fmtDur(now()-cur.start):'00:00'}</div>${cur?`<div class="since">desde ${hms(cur.start)}</div>`:'<div class="since">aguardando</div>'}</div>
      </div>
      <div class="nowfoot">
        <span id="gpsChip" class="gpschip">${gpsChipText()}</span>
        ${prev?`<div class="prev"><span class="pl">Antes</span>${prev}</div>`:''}
      </div>
      ${lastMark?`<div class="prev note1">📝 ${hms(lastMark.t)} · ${esc(lastMark.text)}</div>`:''}
    </div>
    <div class="obsmid">
      ${favs?`<div class="grp">★ Principais</div><div class="acts fill">${favs}</div>`:''}
      ${prods?`<div class="grp">Outras produtivas</div><div class="acts">${prods}</div>`:''}
    </div>
    <div class="obsbot">
      ${stopBtn}
      <div class="actions">
        <button class="btn" id="bNote">📝 Nota${s.marks.length?` <span class="badge">${s.marks.length}</span>`:''}</button>
        <button class="btn" id="bFoto">📷 Foto${(s.photos||[]).length?` <span class="badge">${s.photos.length}</span>`:''}</button>
        <button class="btn" id="bUndo" ${s.events.length?'':'disabled'}>↶ Voltar</button>
        <button class="btn danger" id="bEnd">${s.start!=null?'■ Fim':'✕ Cancelar'}</button>
      </div>
    </div>
  </div>`;
}

// ícones de tempos e movimentos por grupo de operação
const SVGA = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const GICONS = {
  P:`<svg ${SVGA}><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2h4M19 6l1.5-1.5"/><path d="M5 13h2M17 13h2" opacity=".5"/></svg>`,

function startSession(){
  const code = UP($('#fEq').value.trim());
  if (!code) { $('#fErr').textContent = 'Informe a frota do equipamento.'; toast('⚠️ Informe a frota (8 caracteres)'); $('#fEq').focus(); return; }
  if (code.length !== 8) { const m = `A frota deve ter exatamente 8 caracteres (digitado: ${code.length}).`; $('#fErr').textContent = m; toast('⚠️ ' + m); $('#fEq').scrollIntoView({block:'center'}); $('#fEq').focus(); return; }
  const type = UP($('#fType').value.trim());
  const profile = $('#fProf').value;
  let eq = D.equipments.find(e => e.code.toLowerCase() === code.toLowerCase());
  if (!eq) { eq = {id:uid(), code, type, profile}; D.equipments.push(eq); }
  else { if (type) eq.type = type; eq.profile = profile; }
  D.settings.observer = UP($('#fObs').value.trim());
  D.settings.lastEquip = eq.code; D.settings.lastProfile = profile;
  const s = {id:uid(), profile, equipCode:eq.code, equipType:type||eq.type||'', operator:UP($('#fOp').value.trim()), observer:D.settings.observer,
    place:UP($('#fPlace').value.trim()), link:UP($('#fLink').value.trim()), start:null, end:null, offsetSec:Number(D.settings.offsetSec)||0, events:[], marks:[], track:[], dist:0};
  s.photos = (D.draftPhotos || []); D.draftPhotos = []; startForm = {};
  D.sessions.push(s); D.activeId = s.id; save(); updateWake(); updateTracking(); render(); vib(40);
}
function switchAct(actId){
  const s = active(); if (!s) return;
  const cur = curEvent(s);
  if (cur && cur.actId === actId) { vib(15); return; }
  const a = actsOf(s).find(x => x.id === actId); if (!a) return;
  const t = now();
  const first = s.start == null;
  if (first) { s.start = t; s.track = []; s.dist = 0; }   // a observação começa no 1º toque numa operação
  if (cur) cur.end = t;
  const ev = {id:uid(), actId:a.id, actCode:a.code||'', actName:a.name, cat:GROUPS[a.cat]?a.cat:'P', color:a.color, start:t, end:null};
  s.events.push(ev); captureGPS(ev); save(); vib(first ? 60 : 35); render();
  if (first) toast('▶ Observação iniciada às ' + hms(t));
}

function undo(){

    s.events.pop();

    if (!s.events.length) { s.start = null; s.track = []; s.dist = 0; s.marks = []; }

function evInfo(s, e){
  const a = actsOf(s).find(x => x.id === e.actId) || {};
  let cat = e.cat;
  if (!GROUPS[cat]) cat = GROUPS[a.cat] ? (cat === 'S' && a.cat === 'P' ? 'X' : a.cat) : (cat === 'S' ? 'X' : 'P');
  return { cat, code: e.actCode ?? a.code ?? '' };
}
function summarize(s){
  const map = new Map(); let total = 0; const byCat = {P:0,A:0,C:0,M:0,X:0}; let nStops = 0;
  s.events.forEach(e => {
    const d = evEnd(s,e) - e.start; total += d;
    const inf = evInfo(s,e); byCat[inf.cat] += d; if (isStop(inf.cat)) nStops++;
    const k = inf.cat + '|' + e.actName; const o = map.get(k) || {name:e.actName, code:inf.code, cat:inf.cat, color:e.color, ms:0, n:0};
    o.ms += d; o.n++; map.set(k,o);
  });
  const rows = [...map.values()].sort((a,b)=> a.cat===b.cat ? b.ms-a.ms : GORDER.indexOf(a.cat)-GORDER.indexOf(b.cat));
  return {rows, total, byCat, nStops};
}

    if (Math.floor(t/1000) !== Math.floor(e.start/1000)) { e.start = t; if (prev) prev.end = t; }

}

function pdb(){

    if (_pdb) return res(_pdb);

      const r = indexedDB.open('tempos_campo_fotos', 1);

      r.onsuccess = () => { _pdb = r.result; res(_pdb); };
      r.onerror = () => rej(r.error);

}

}

// ZIP mínimo (sem compressão) para gerar o KMZ
const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipFiles(files, mime){   // files: [{name, data: Uint8Array|string}]  — ZIP sem compressão
  const enc = new TextEncoder(), parts = [], cds = []; let off = 0;
  const d = new Date(), dt = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const W = (dv, arr) => arr.forEach(([o,v,s]) => s===4 ? dv.setUint32(o,v,true) : dv.setUint16(o,v,true));
  files.forEach(f => {
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, fn = enc.encode(f.name), crc = crc32(data), n = data.length;
    const lh = new DataView(new ArrayBuffer(30)); W(lh, [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,tm,2],[12,dt,2],[14,crc,4],[18,n,4],[22,n,4],[26,fn.length,2],[28,0,2]]);
    const ch = new DataView(new ArrayBuffer(46)); W(ch, [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,tm,2],[14,dt,2],[16,crc,4],[20,n,4],[24,n,4],[28,fn.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]]);
    parts.push(lh, fn, data); cds.push(ch, fn); off += 30 + fn.length + n;
  });
  const cdLen = cds.reduce((a,x) => a + (x.byteLength ?? x.length), 0);
  const end = new DataView(new ArrayBuffer(22)); W(end, [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,files.length,2],[10,files.length,2],[12,cdLen,4],[16,off,4],[20,0,2]]);
  return new Blob([...parts, ...cds, end], {type: mime || 'application/zip'});
}

function exportDialog(name, content, mime){

function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.sessions)) throw 0;
      const ids = new Set(D.sessions.map(s=>s.id)); let n = 0;
      d.sessions.forEach(s => { if (!ids.has(s.id) && s.start != null) { s.events=s.events||[]; s.marks=s.marks||[]; if (s.end==null) s.end = s.events.length ? (s.events[s.events.length-1].end ?? s.events[s.events.length-1].start) : s.start; D.sessions.push(s); n++; } });
      (d.equipments||[]).forEach(e => { if (!D.equipments.some(x=>x.code===e.code)) D.equipments.push(e); });
      D.sessions.sort((a,b)=>a.start-b.start);
      save(); render(); toast(n+' sessão(ões) importada(s)');
    } catch(e){ toast('Arquivo de backup inválido'); }
  };
  r.readAsText(file);
}

      <label>Intervalo entre pontos do trajeto</label>
      <select id="oGpsInt">${[2,5,10,15,30].map(v => `<option value="${v}" ${Number(D.settings.gpsInt)===v?'selected':''}>${v} segundos${v===5?' (recomendado)':''}</option>`).join('')}</select>
      <div class="muted mt">Para o trajeto não ter falhas, mantenha o app aberto com a tela ligada durante a observação (o celular pausa o GPS de apps em segundo plano).</div>
    </div>
    <div class="card"><h2>Dados</h2>
      <div class="muted">Os dados ficam só neste aparelho — faça backup com frequência.</div>
      <div class="dstats">
        <div><b>${done().length}</b><span>observações</span></div>
        <div><b>${D.sessions.reduce((a,s)=>a+(s.track?s.track.length:0),0)}</b><span>pontos GPS</span></div>
        <div><b>${allPhotos(D.sessions).length + (D.draftPhotos||[]).length}</b><span>fotos</span></div>
        <div><b>${Object.values(D.settings.profiles).reduce((a,p)=>a+p.acts.length,0)}</b><span>operações</span></div>
      </div>
      <button class="btn block mt" id="dBackup">💾 Fazer backup completo</button>
      <div class="muted mt">O backup guarda observações e cadastros. As fotos são exportadas à parte em Sessões › 📷 Fotos (ZIP).</div>
      <div class="dzone">
        <div class="dz-row"><div><b>Apagar observações</b><div class="muted">Remove sessões, trajetos GPS e anotações. <b>Mantém</b> equipamentos, operações, códigos e configurações.</div></div>
          <button class="btn danger sm" id="dWipe" ${done().length?'':'disabled'}>Apagar</button></div>
        <div class="dz-row"><div><b>Restaurar app de fábrica</b><div class="muted">Apaga <b>tudo</b>: observações, equipamentos, cadastro de operações e configurações. O app volta como recém-instalado.</div></div>
          <button class="btn dangerfill sm" id="dFactory">Restaurar</button></div>
      </div>
    </div>
    <div class="muted" style="text-align:center;margin:8px 0 16px">Tempos em Campo · v2.6 · CCT cana · funciona offline</div>`;
}

// ---------- cadastro de equipamentos ----------
function eqDialog(i){
  const isNew = i < 0, e = isNew ? {code:'', type:'', profile: cfgProf || D.settings.lastProfile || 'colhedora'} : D.equipments[i];
  const used = isNew ? 0 : D.sessions.filter(s => s.equipCode === e.code).length;
  openModal(`<h2>${isNew?'Novo equipamento':'Editar equipamento'}</h2>
    <label>Tipo *</label><select id="qProf">${Object.keys(D.settings.profiles).map(k => `<option value="${k}" ${k===(e.profile||'colhedora')?'selected':''}>${esc(prof(k).label)}</option>`).join('')}</select>
    <div class="grid2"><div><label>Frota * <span class="muted" id="qCnt">(8 caracteres)</span></label><input id="qCode" value="${esc(e.code)}" maxlength="8" minlength="8" placeholder="Ex.: 00003012" autocomplete="off"></div>
      <div><label>Modelo</label><input id="qType" value="${esc(e.type||'')}" placeholder="Ex.: CH570"></div></div>
    ${used?`<div class="muted mt">Usado em ${used} observação(ões). Alterar aqui não muda as observações já feitas.</div>`:''}
    <div id="qErr" class="err"></div>
    <div class="row mt">${isNew?'':'<button class="btn danger" id="qDel">Excluir</button>'}<button class="btn" id="qNo">Cancelar</button><button class="btn pri" id="qOk">Salvar</button></div>`);
  $('#qNo').onclick = closeModal;
  $('#qOk').onclick = () => {
    const code = UP($('#qCode').value.trim()); if (!code) { $('#qErr').textContent = 'Informe a frota.'; return; }
    if (code.length !== 8) { $('#qErr').textContent = `A frota deve ter exatamente 8 caracteres (digitado: ${code.length}).`; return; }
    const dup = D.equipments.find(x => x !== e && x.code.toLowerCase() === code.toLowerCase());
    if (dup) { $('#qErr').textContent = `A frota ${code} já está cadastrada (${prof(dup.profile).label}).`; return; }
    Object.assign(e, {code, type:UP($('#qType').value.trim()), profile:$('#qProf').value});
    if (isNew) { e.id = uid(); D.equipments.push(e); }
    save(); closeModal(); render(); toast('Equipamento salvo');
  };
  if (!isNew) $('#qDel').onclick = () => confirmBox('Excluir equipamento', `Excluir ${e.code} do cadastro? As observações já feitas são mantidas.`, 'Excluir', () => { D.equipments.splice(D.equipments.indexOf(e),1); save(); render(); }, true);
  { const i = $('#qCode'), l = $('#qCnt'); const f = () => { const n = i.value.trim().length; l.textContent = n ? `(${n}/8)` : '(8 caracteres)'; l.className = n === 8 ? 'ok8' : (n ? 'bad8' : 'muted'); }; i.addEventListener('input', f); f(); }
  if (isNew) setTimeout(() => $('#qCode') && $('#qCode').focus(), 50);
}

// ---------- apagar dados ----------
function wipeDialog(factory){
  const n = done().length, act = active();
  const keep = factory ? '' : `<div class="wbox ok"><b>✓ Será mantido</b><br>${D.equipments.length} equipamento(s), cadastro de operações e paradas (códigos, grupos, ★ principais), anotações rápidas, ajuste de relógio e configurações.</div>`;
  const lose = factory
    ? `${n} observação(ões) com trajetos e anotações, ${D.equipments.length} equipamento(s), <b>todo o cadastro de operações e paradas</b> (volta à lista padrão, sem códigos), anotações rápidas, ajuste de relógio e configurações.`
    : `${n} observação(ões), com trajetos GPS, anotações e ${allPhotos(D.sessions).length} foto(s)${act?' — inclusive a observação em andamento':''}.`;
  openModal(`<h2>${factory?'⚠️ Restaurar app de fábrica':'Apagar observações'}</h2>
    <div class="wbox bad"><b>✕ Será apagado</b><br>${lose}</div>
    ${keep}
    <div class="muted mt">Não é possível desfazer. Se ainda não fez, faça um backup antes.</div>
    <button class="btn block mt" id="wBk">💾 Fazer backup antes</button>
    ${factory?`<label>Para confirmar, digite <b>APAGAR</b></label><input id="wTxt" autocomplete="off" autocapitalize="characters" placeholder="APAGAR">`:''}
    <div id="wErr" class="err"></div>
    <div class="row mt"><button class="btn" id="wNo">Cancelar</button><button class="btn dangerfill" id="wOk" ${factory?'disabled':''}>${factory?'Restaurar de fábrica':'Apagar observações'}</button></div>`);
  $('#wNo').onclick = closeModal;
  $('#wBk').onclick = () => exportDialog('backup_tempos_'+stamp()+'.json', JSON.stringify(D), 'application/json');
  const t = $('#wTxt'); if (t) t.oninput = () => { $('#wOk').disabled = t.value.trim().toUpperCase() !== 'APAGAR'; };
  $('#wOk').onclick = () => {
    if (factory) {
      if (!t || t.value.trim().toUpperCase() !== 'APAGAR') { $('#wErr').textContent = 'Digite APAGAR para confirmar.'; return; }
      D = defaults(); cfgProf = null; photoClear().catch(()=>{}); thumbCache.clear();
    } else {
      photoDel(allPhotos(D.sessions).map(x => x.p.id)).catch(()=>{});
      D.sessions = []; D.activeId = null;
    }
    detailId = null; save(); updateWake(); updateTracking(); closeModal(); render();
    toast(factory ? 'App restaurado de fábrica' : 'Observações apagadas — cadastros mantidos');
  };
}

// ---------- binding ----------
function bind(){
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  on('#bStart', startSession); on('#bNote', noteDialog); on('#bFoto', () => takePhoto('obs')); on('#phAdd', () => takePhoto('draft'));
  document.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => photoViewer(b.dataset.pvs ? D.sessions.find(x => x.id === b.dataset.pvs) : null, +b.dataset.pv));
  loadThumbs(); on('#bStops', stopsDialog); on('#bUndo', undo); on('#bEnd', endSession);
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => switchAct(b.dataset.act));
  // sessions
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { detailId = b.dataset.open; render(); window.scrollTo(0,0); });
  on('#xAll', () => exportDialog('atividades_'+stamp()+'.csv', csvEvents(done()), 'text/csv'));
  on('#xGeo', () => gpsDialog(done(), 'trajetos_'+stamp()));
  on('#xPh', () => photosZip(done(), 'fotos_'+stamp()));
  on('#xNotes', () => exportDialog('anotacoes_'+stamp()+'.csv', csvNotes(done()), 'text/csv'));
  on('#xJson', () => exportDialog('backup_tempos_'+stamp()+'.json', JSON.stringify(D), 'application/json'));
  on('#xImp', () => $('#fileIn').click());
  on('#bBack', () => { detailId = null; render(); });
  const s = detailId && D.sessions.find(x=>x.id===detailId);
  if (s) {
    on('#xPdf', () => exportPDF(s)); on('#xPdfTop', () => exportPDF(s));
    on('#xPhOne', () => photosZip([s], 'fotos_'+s.equipCode.replace(/[^\w-]+/g,'_')+'_'+dmy(s.start).replace(/\//g,'-')));
    on('#xGeoOne', () => gpsDialog([s], 'trajeto_'+s.equipCode.replace(/[^\w-]+/g,'_')+'_'+dmy(s.start).replace(/\//g,'-')));
    on('#xOne', () => exportDialog(s.equipCode.replace(/[^\w-]+/g,'_')+'_'+dmy(s.start).replace(/\//g,'-')+'.csv', csvEvents([s]), 'text/csv'));
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editEvent(s, +b.dataset.edit));
    document.querySelectorAll('[data-delmark]').forEach(b => b.onclick = ev => { ev.stopPropagation(); const i=+b.dataset.delmark;
      confirmBox('Excluir anotação', s.marks[i].text, 'Excluir', () => { s.marks.splice(i,1); save(); render(); }, true); });
    on('#bDelSes', () => confirmBox('Excluir sessão', `Excluir a observação de ${s.equipCode} de ${dmy(s.start)}? Isso não pode ser desfeito.`, 'Excluir', () => {
      photoDel((s.photos||[]).map(p=>p.id)).catch(()=>{});
      D.sessions = D.sessions.filter(x=>x.id!==s.id); detailId=null; save(); render(); toast('Sessão excluída'); }, true));
  }
  // config
  // start form: tipo e frota se completam
  const fProf = $('#fProf'), fEq = $('#fEq');
  const cnt = (inp, lab) => { if (!inp || !lab) return; const f = () => { const n = inp.value.trim().length; lab.textContent = n ? `(${n}/8)` : '(8 caracteres)'; lab.className = n === 8 ? 'ok8' : (n ? 'bad8' : 'muted'); inp.classList.toggle('inv', n > 0 && n !== 8); }; inp.addEventListener('input', f); f(); };
  cnt($('#fEq'), $('#fEqCnt'));
  ['fEq','fType','fOp','fPlace','fLink','fObs'].forEach(id => { const el = $('#'+id); if (el) el.addEventListener('input', () => { startForm[id] = el.value; }); });
  const setProf = k => { if (!fProf) return; fProf.value = k; startForm.fProf = k;
    document.querySelectorAll('[data-ptile]').forEach(t => t.classList.toggle('on', t.dataset.ptile === k));
    document.querySelectorAll('[data-rprof]').forEach(c => c.hidden = c.dataset.rprof !== k);
    $('#fLinkL').textContent = prof(k).link; };
  if (fProf) fProf.onchange = () => setProf(fProf.value);
  document.querySelectorAll('[data-ptile]').forEach(t => t.onclick = () => {
    const changed = fProf.value !== t.dataset.ptile; setProf(t.dataset.ptile);
    if (changed) { const e = D.equipments.find(x => x.code === fEq.value.trim()); if (e && (e.profile||'colhedora') !== fProf.value) { fEq.value=''; $('#fType').value=''; } } });
  document.querySelectorAll('[data-req]').forEach(c => c.onclick = () => {
    const e = D.equipments.find(x => x.code === c.dataset.req); if (!e) return;
    fEq.value = e.code; $('#fType').value = e.type || ''; startForm.fEq = e.code; startForm.fType = e.type || ''; vib(15);
    document.querySelectorAll('[data-req]').forEach(x => x.classList.toggle('on', x === c)); });
  on('#goSes', () => { tab = 'ses'; detailId = null; render(); });
  document.querySelectorAll('[data-open-ses]').forEach(b => b.onclick = () => { tab='ses'; detailId=b.dataset.openSes; render(); window.scrollTo(0,0); });
  if (fEq) fEq.onchange = () => { const e = D.equipments.find(x => x.code.toLowerCase() === fEq.value.trim().toLowerCase());
    if (e) { if (e.profile) { fProf.value = e.profile; fProf.onchange(); } if (e.type) { $('#fType').value = e.type; startForm.fType = e.type; } } };
  // config
  const A = tab === 'cad' ? prof(cfgProf).acts : [];
  document.querySelectorAll('[data-cad]').forEach(b => b.onclick = () => { cadSub = b.dataset.cad; render(); window.scrollTo(0,0); });
  on('#eqNew', () => eqDialog(-1));
  document.querySelectorAll('[data-eqedit]').forEach(b => b.onclick = () => eqDialog(+b.dataset.eqedit));
  document.querySelectorAll('[data-cprof]').forEach(b => b.onclick = () => { cfgProf = b.dataset.cprof; render(); });
  document.querySelectorAll('[data-aup]').forEach(b => b.onclick = () => {
    const i=+b.dataset.aup, c=A[i].cat||'P'; let j=i-1; while (j>=0 && (A[j].cat||'P')!==c) j--;
    if (j>=0) { [A[j],A[i]]=[A[i],A[j]]; save(); render(); } });
  document.querySelectorAll('[data-eqdel]').forEach(b => b.onclick = () => { const i=+b.dataset.eqdel;
    confirmBox('Remover equipamento', `Remover ${D.equipments[i].code} do cadastro? As sessões já feitas são mantidas.`, 'Remover', () => { D.equipments.splice(i,1); save(); render(); }, true); });
  document.querySelectorAll('[data-aedit]').forEach(b => b.onclick = () => actDialog(+b.dataset.aedit));
  on('#aNew', () => actDialog(-1));
  on('#aReset', () => confirmBox('Restaurar padrão', `Substituir os botões e anotações rápidas de ${prof(cfgProf).label} pela lista padrão?`, 'Restaurar', () => { D.settings.profiles[cfgProf] = buildProfiles()[cfgProf]; save(); render(); }));
  const q = $('#qNotes'); if (q) q.onchange = () => { prof(cfgProf).notes = q.value.split('\n').map(x=>UP(x.trim())).filter(Boolean); save(); toast('Anotações rápidas salvas'); };
  on('#cCalc', () => {
    const v = $('#cTel').value; if (!v) { toast('Informe a hora da telemetria'); return; }
    const p = v.split(':').map(Number); const d = new Date(); d.setHours(p[0],p[1],p[2]||0,0);
    let diff = Math.round((d.getTime() - Date.now())/1000);
    if (diff > 43200) diff -= 86400; if (diff < -43200) diff += 86400;
    $('#cOff').value = diff; toast('Ajuste calculado: '+diff+' s — toque em Salvar');
  });
  on('#cSave', () => { D.settings.offsetSec = parseInt($('#cOff').value,10)||0; save(); render(); toast('Ajuste salvo'); });
  const w = $('#oWake'); if (w) w.onchange = () => { D.settings.wake = w.checked; save(); updateWake(); };
  const g = $('#oGps'); if (g) g.onchange = () => { D.settings.gps = g.checked; save(); updateTracking(); if (g.checked) captureGPS({}); };
  const gi = $('#oGpsInt'); if (gi) gi.onchange = () => { D.settings.gpsInt = Number(gi.value); save(); toast('Intervalo salvo'); };
  on('#dBackup', () => exportDialog('backup_tempos_'+stamp()+'.json', JSON.stringify(D), 'application/json'));
  on('#dWipe', () => wipeDialog(false));
  on('#dFactory', () => wipeDialog(true));
}

// ---------- live clock ----------
function tick(){
  const t = now();
  document.querySelectorAll('[data-since]').forEach(el => el.textContent = fmtDur(t - Number(el.dataset.since)));
  document.querySelectorAll('[data-clock]').forEach(el => el.textContent = hms(t));
  document.querySelectorAll('[data-devclock]').forEach(el => el.textContent = hms(Date.now()));
}
setInterval(tick, 1000);

// ---------- offline (service worker) ----------
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch(e){} });
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

render(); updateWake(); updateTracking();
setInterval(updateGpsChip, 5000);
</script>
</body>
</html>
